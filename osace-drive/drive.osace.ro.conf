# ==============================================================================
# Nginx Configuration Template for drive.osace.ro (SPA Vue 3)
# ==============================================================================
# Locație pe VPS: /etc/nginx/sites-available/drive.osace.ro
# Simlink: sudo ln -s /etc/nginx/sites-available/drive.osace.ro /etc/nginx/sites-enabled/
# Certificat SSL: sudo certbot --nginx -d drive.osace.ro
# ==============================================================================

server {
    server_name drive.osace.ro;

    # Calea către folderul de build dist
    root /opt/www/drive.osace.ro/dist;
    index index.html;

    # Gzip Compression pentru performanță maximă
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Securitate & Headere
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Servire Single Page Application (SPA Router fallback la index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pentru fișiere statice generate de Vite (hash-uite)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    listen 80;
    listen [::]:80;
}
